# Reference reverse proxy for `bielik-one frontend`, which listens on 127.0.0.1 with no authentication or TLS.
# The proxy terminates TLS, authenticates every client, applies the same body limit as the frontend plus a rate
# limit, and forwards only the public routes. Everything else (/docs, /openapi.json, anything added later) is 404.
# See docs/deployment.md. Replace decisions.example.org, the certificate paths and the upstream port.

limit_req_zone  $binary_remote_addr zone=bielik_one_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=bielik_one_conn:10m;

upstream bielik_one {
    server 127.0.0.1:8026;  # bielik-one frontend (8012 for the 4B packages); keep it and vLLM on loopback
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name decisions.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name decisions.example.org;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The frontend refuses bodies over 16 MiB (--max-body-mb); refuse them here first. Slow clients are cut off
    # here instead of holding a frontend connection.
    client_max_body_size  16m;
    client_header_timeout 10s;
    client_body_timeout   30s;

    limit_req  zone=bielik_one_rate burst=20 nodelay;
    limit_conn bielik_one_conn 16;
    limit_req_status  429;
    limit_conn_status 429;

    # Authentication. HTTP Basic over TLS with an htpasswd file is shown because nginx has it built in; for single
    # sign-on use auth_request with an OIDC proxy, or client certificates (docs/deployment.md).
    auth_basic           "bielik-one";
    auth_basic_user_file /etc/nginx/bielik-one.htpasswd;

    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   Authorization "";          # the credentials stay at the proxy
    proxy_set_header   X-Request-Id $request_id;  # one id in the nginx and the frontend logs

    location = /v1/systemone {
        limit_except POST { deny all; }
        proxy_read_timeout 660s;  # a little over the frontend's own limits
        proxy_pass http://bielik_one;
    }

    location = /v1/chat/completions {
        limit_except POST { deny all; }
        proxy_buffering    off;   # streamed answers
        proxy_read_timeout 3600s;
        proxy_pass http://bielik_one;
    }

    location = /v1/completions {
        limit_except POST { deny all; }
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_pass http://bielik_one;
    }

    location = /v1/models {
        limit_except GET { deny all; }
        proxy_pass http://bielik_one;
    }

    # Load-balancer probe: no credentials, but only from the networks that run the probes.
    location = /health {
        auth_basic off;
        allow 127.0.0.1;
        allow ::1;
        # allow 10.0.0.0/8;  # your load balancer's network
        deny  all;
        limit_except GET { deny all; }
        proxy_read_timeout 10s;
        proxy_pass http://bielik_one;
    }

    location / {
        return 404;
    }
}
