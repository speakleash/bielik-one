# Reference reverse proxy for `vllm serve ... --middleware bielik_one.api.vllm_middleware.SystemOneMiddleware`.
# vLLM itself serves many more routes than the public API needs (metrics, tokenizer, scoring, SageMaker, runtime
# administration), so the proxy forwards only the ones below and answers 404 for the rest. vLLM's own --api-key
# guards only /v1 paths; the proxy authenticates every request instead. See docs/deployment.md.

limit_req_zone  $binary_remote_addr zone=vllm_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=vllm_conn:10m;

upstream vllm_public {
    server 127.0.0.1:8000;  # vllm serve --host 127.0.0.1 --port 8000
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name decisions.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name decisions.example.org;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size  16m;  # SYSTEMONE_MAX_BODY_MB
    client_header_timeout 10s;
    client_body_timeout   30s;

    limit_req  zone=vllm_rate burst=20 nodelay;
    limit_conn vllm_conn 16;
    limit_req_status  429;
    limit_conn_status 429;

    auth_basic           "bielik-one";
    auth_basic_user_file /etc/nginx/bielik-one.htpasswd;

    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   Authorization "";  # set "Bearer <vLLM --api-key>" here if vLLM also requires its key
    proxy_set_header   X-Request-Id $request_id;
    # The middleware's own loopback reads carry this header with a per-process secret; never accept it from outside.
    proxy_set_header   X-SystemOne-Internal "";

    location = /v1/systemone {
        limit_except POST { deny all; }
        proxy_read_timeout 660s;
        proxy_pass http://vllm_public;
    }

    location = /v1/chat/completions {
        limit_except POST { deny all; }
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_pass http://vllm_public;
    }

    location = /v1/completions {
        limit_except POST { deny all; }
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_pass http://vllm_public;
    }

    location = /v1/models {
        limit_except GET { deny all; }
        proxy_pass http://vllm_public;
    }

    # Readiness of decisions, for the load balancer only.
    location = /v1/systemone/health {
        auth_basic off;
        allow 127.0.0.1;
        allow ::1;
        # allow 10.0.0.0/8;  # your load balancer's network
        deny  all;
        limit_except GET { deny all; }
        proxy_read_timeout 15s;
        proxy_pass http://vllm_public;
    }

    location / {
        return 404;
    }
}
